[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-finance-risk-intelligence"
version = "0.1.0"
description = "Reproducible analytics and NLP triage for CFPB consumer complaints"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.32,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

